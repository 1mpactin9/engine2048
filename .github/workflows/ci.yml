name: CI

on:
  push:
    branches: [main, engine-rework]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Configure (CMake)
      working-directory: engine-next
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      working-directory: engine-next
      run: cmake --build build --config Release --parallel

    - name: Run tests
      working-directory: engine-next
      run: ctest --test-dir build --output-on-failure

    - name: Smoke test
      working-directory: engine-next/build
      run: ./engine2048 --games 2 --seed 1 --max-depth 5 && ./test_correctness
